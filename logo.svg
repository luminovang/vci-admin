<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 330 100">
      <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#063ca9"/>
              <stop offset="50%" stop-color="#0750e1"/>
              <stop offset="100%" stop-color="#0880e9"/>
          </linearGradient>

          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
          </feMerge>
          </filter>
      </defs>

      <!-- Icon -->
      <g transform="translate(20,20)">
          <!-- Outer ring -->
          <circle cx="40" cy="40" r="34" fill="none" stroke="url(#g)" stroke-width="6"/>

          <!-- Inner V shape -->
          <path d="M25 25 L40 60 L55 25"
              fill="none"
              stroke="url(#g)"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
              filter="url(#glow)"/>

          <!-- Node dot -->
          <circle cx="40" cy="60" r="4.5" fill="#7aa1f0"/>
      </g>

      <!-- Text -->
      <text x="110" y="62"
              font-family="Inter, Segoe UI, Arial, sans-serif"
              font-size="28"
              fill="#063ca9"
              font-weight="600">
          PHP LUMINOVA
      </text>

      <text x="110" y="88"
              font-family="Inter, Segoe UI, Arial, sans-serif"
              font-size="18"
              fill="#acacb3"
              letter-spacing="2">
          VCI SYSTEM
      </text>
</svg>
